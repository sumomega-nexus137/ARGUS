[project]
name = "argus-floodops-backend"
version = "0.1.0"
description = "ARGUS FloodOps — Regional Flood Decision & Response System (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.2",
    "ortools>=9.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pillow>=10.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP042", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["alembic/", "app/tests/"]
