name: ARGUS application readiness

on:
  workflow_dispatch:
  push:
    branches:
      - claude/festive-faraday-90f1gh
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/realdata/**"
      - "scripts/e2e/**"
      - ".github/workflows/application-readiness.yml"

jobs:
  backend-realdata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Install and verify pinned real-data packs
        working-directory: backend
        run: |
          python -m app.cli install-realdata
          python -m app.cli realdata-status --verify
      - name: Ruff
        working-directory: backend
        run: ruff check app
      - name: DEMO tests
        working-directory: backend
        run: pytest -q app/tests
      - name: Real-data tests with competition diagnostics
        working-directory: backend
        run: pytest -q -s app/tests_realdata

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npx eslint .
      - name: i18n
        working-directory: frontend
        run: node scripts/check-i18n.mjs
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Production build
        working-directory: frontend
        run: npm run build

  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Verify real public Open-Meteo endpoints
        run: |
          python scripts/realdata/api_preflight.py --output /tmp/api_readiness.json
          cat /tmp/api_readiness.json
