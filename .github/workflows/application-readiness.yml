name: ARGUS application readiness

on:
  workflow_dispatch:
  push:
    branches:
      - claude/festive-faraday-90f1gh
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/realdata/**"
      - "scripts/e2e/**"
      - "scripts/start-argus.ps1"
      - "scripts/start-argus.sh"
      - "docker-compose.yml"
      - ".github/workflows/application-readiness.yml"

jobs:
  backend-realdata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Install and verify pinned real-data packs
        working-directory: backend
        run: |
          python -m app.cli install-realdata
          python -m app.cli realdata-status --verify
      - name: Ruff
        working-directory: backend
        run: ruff check app
      - name: DEMO tests
        working-directory: backend
        run: pytest -q app/tests
      - name: Real-data tests with competition diagnostics
        working-directory: backend
        run: pytest -q -s app/tests_realdata

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npx eslint .
      - name: i18n
        working-directory: frontend
        run: node scripts/check-i18n.mjs
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Production build
        working-directory: frontend
        run: npm run build

  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Verify real public Open-Meteo endpoints
        run: |
          python scripts/realdata/api_preflight.py --output /tmp/api_readiness.json
          cat /tmp/api_readiness.json

  docker-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARGUS_DATA_PROFILE: historical
      ARGUS_INSTALL_REALDATA: "true"
      ARGUS_OPEN_METEO_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start full Docker stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for API and console
        run: |
          set -e
          for i in $(seq 1 180); do
            if curl -fsS http://localhost:8000/api/system/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              break
            fi
            sleep 3
          done
          python - <<'PY'
          import json
          h=json.load(open("/tmp/health.json"))
          assert h["status"]=="ok" and h["database"]=="ok", h
          PY
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/login >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "frontend never became ready"
          exit 1
      - name: Verify real-data reuse after backend restart
        run: |
          BEFORE=$(docker compose exec -T backend python -m app.cli realdata-status --verify)
          echo "$BEFORE"
          docker compose restart backend
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/system/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          AFTER=$(docker compose exec -T backend python -m app.cli realdata-status --verify)
          echo "$AFTER"
          test "$BEFORE" = "$AFTER"
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250
      - name: Stop stack
        if: always()
        run: docker compose down
