name: ARGUS PostgreSQL migration smoke
# Verifies the production PostGIS schema path independently of SQLite tests.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/festive-faraday-90f1gh
    paths:
      - ".github/workflows/postgres-smoke.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARGUS_DATABASE_URL: postgresql+psycopg2://argus:argus@localhost:5432/argus
      ARGUS_DATA_PROFILE: demo
      ARGUS_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply Alembic baseline to PostGIS
        working-directory: backend
        run: alembic upgrade head
      - name: Verify geometry columns and schema
        run: |
          python - <<'PY'
          import psycopg2
          conn=psycopg2.connect("dbname=argus user=argus password=argus host=localhost")
          cur=conn.cursor()
          cur.execute("select count(*) from information_schema.tables where table_schema='public'")
          tables=cur.fetchone()[0]
          cur.execute("select count(*) from geometry_columns")
          geoms=cur.fetchone()[0]
          print("public tables",tables,"geometry columns",geoms)
          assert tables > 10
          assert geoms > 0
          PY
