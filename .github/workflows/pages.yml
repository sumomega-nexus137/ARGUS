name: Online demo (GitHub Pages)

# Builds the read-only online demo and publishes it with GitHub Pages from the `gh-pages` branch:
#   1. installs the backend and the checksummed real-data packs,
#   2. runs the real ARGUS engines once and records every API answer the console needs
#      (scripts/static_demo/record.py — stress test, CP-SAT alternatives, resource gap, bottlenecks, validation),
#   3. builds the console as static files that read that snapshot (frontend/lib/staticDemo.ts),
#   4. force-pushes the site as a single commit to `gh-pages` (no history bloat).
# One-time: Settings → Pages → "Deploy from a branch" → gh-pages / (root), if GitHub has not enabled it already.
# Own domain: set it in Settings → Pages → Custom domain; the next run keeps its CNAME and builds without a path prefix.

on:
  push:
    branches:
      - main
      - claude/festive-faraday-90f1gh
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/static_demo/**"
      - "data/realdata/packs.lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARGUS_DATA_PROFILE: historical
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Cache real-data packs
        uses: actions/cache@v4
        with:
          path: data/realdata/_cache
          key: realdata-${{ hashFiles('data/realdata/packs.lock.json') }}

      - name: Install real-data packs (checksum-verified)
        working-directory: backend
        run: python -m app.cli install-realdata

      - name: Record the demo snapshot with the real engines
        working-directory: backend
        run: python ../scripts/static_demo/record.py --out ../frontend/public/demo-data

      - name: Custom domain (kept from the gh-pages branch if one is configured)
        id: site
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null && git show FETCH_HEAD:CNAME > /tmp/CNAME 2>/dev/null && [ -s /tmp/CNAME ]; then
            echo "cname=$(tr -d '[:space:]' < /tmp/CNAME)" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "cname=" >> "$GITHUB_OUTPUT"
            echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the static console
        working-directory: frontend
        env:
          ARGUS_STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm ci
          npm run build
          touch out/.nojekyll
          if [ -n "${{ steps.site.outputs.cname }}" ]; then echo "${{ steps.site.outputs.cname }}" > out/CNAME; fi
          du -sh out out/demo-data

      - name: Publish to gh-pages
        working-directory: frontend/out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Online demo from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          if [ -n "${{ steps.site.outputs.cname }}" ]; then url="https://${{ steps.site.outputs.cname }}/"; else url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/"; fi
          echo "### Online demo published → $url" >> "$GITHUB_STEP_SUMMARY"
          echo "If the page is not live yet: Settings → Pages → Deploy from a branch → gh-pages / (root)." >> "$GITHUB_STEP_SUMMARY"
