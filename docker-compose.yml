# ARGUS FloodOps — production-like stack: PostGIS + API + console.
#   docker compose up --build        → http://localhost:3000  (demo accounts: see README)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      ARGUS_DATABASE_URL: postgresql+psycopg2://argus:${POSTGRES_PASSWORD:-argus}@db:5432/argus
      ARGUS_DEMO_MODE: ${ARGUS_DEMO_MODE:-true}
      ARGUS_JWT_SECRET: ${ARGUS_JWT_SECRET:-change-me}
      ARGUS_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: [./data/imports:/srv/argus/data/imports]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  frontend:
    build: { context: ./frontend, args: { ARGUS_API_URL: "http://backend:8000" } }
    environment: { ARGUS_API_URL: "http://backend:8000" }
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
